name: CI + Windows Packaging

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

jobs:
  build-and-test:
    name: Build + Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore pixel-press.sln

      - name: Build
        run: dotnet build pixel-press.sln -c Release --no-restore

      - name: Test
        run: dotnet test pixel-press.sln -c Release --no-build --verbosity normal

  release-artifacts:
    name: Publish win-x64 zip + MSIX
    runs-on: windows-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore pixel-press.sln

      - name: Publish self-contained win-x64 app
        run: >
          dotnet publish src/PixelPress.App/PixelPress.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=true
          -o artifacts/win-x64

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/pixel-press-win-x64.zip -Force

      - name: Build unsigned MSIX package
        shell: pwsh
        run: |
          dotnet publish src/PixelPress.App/PixelPress.App.csproj `
            -c Release `
            -r win-x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\msix\"

          $msix = Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts\msix" -Recurse -Filter *.msix |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $msix) {
            throw "MSIX artifact was not produced."
          }

          Copy-Item $msix.FullName "$env:GITHUB_WORKSPACE\artifacts\pixel-press.msix" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixel-press-${{ github.ref_name }}
          path: |
            artifacts/pixel-press-win-x64.zip
            artifacts/pixel-press.msix
          if-no-files-found: error
